name: Linux Build
# Item 33 (ENGINE_OTHER_PLATFORMS.md): the Linux x86_64 package with the in-app engine and the pinned model.
# A green run proves the package BUILDS (the first states of item 33's five) - not that inference works on real
# hardware, which is Q6's proof on a real Linux machine.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write      # the draft release the package goes up to (last step)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: System packages for the window (pywebview's GTK backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pygobject 3.51+ needs girepository-2.0 (GLib 2.80), which Ubuntu 22.04 does not have (the v1.1.1 build
          # failed on it, 2026-10-08); 3.50 is the last that builds against 22.04's girepository-1.0.
          pip install pyinstaller "pygobject<3.51"
      - name: Fetch and verify the pinned model
        env:
          GH_TOKEN: ${{ github.token }}
        run: python fetch_model.py
      # The voice files are git-ignored, and without them spec_engine only warns: the build would ship with no voice.
      - name: Fetch and verify the voice models (hearing, speaking, whose voice)
        run: |
          python scripts/fetch_whisper_model.py
          python scripts/fetch_kokoro_model.py
          python scripts/fetch_voiceprint_model.py
      - name: Build with PyInstaller
        run: pyinstaller groundwork_linux.spec --clean --noconfirm
      - name: The engine imports and the model is where it looks (packaging only - not inference)
        run: |
          test -f dist/Groundwork/_internal/models/phi3.5-mini-instruct-q4.gguf
          ls dist/Groundwork/_internal/llama_cpp/lib/ | grep -q libllama
      - name: The voice is in the package (packaging only - not a microphone)
        run: |
          test -f dist/Groundwork/_internal/models/ggml-base.en.bin
          test -f dist/Groundwork/_internal/models/kokoro-v1.0.int8.onnx
          test -f dist/Groundwork/_internal/models/voices-v1.0.bin
          test -f dist/Groundwork/_internal/models/voxceleb_resnet34_LM.onnx
          ls dist/Groundwork/_internal | grep -q _pywhispercpp
          test -d dist/Groundwork/_internal/onnxruntime
          test -d dist/Groundwork/_internal/espeakng_loader
      - name: Archive
        run: tar -czf Groundwork-linux-x86_64.tar.gz -C dist Groundwork
      # Rob 2026-11-09: a draft release, not an Actions artifact, as macos-build.yml (the artifact quota stayed "hit"
      # on 2026-11-08). Over GitHub's 2 GiB per-file limit, so in parts; join them in order with:
      # cat Groundwork-linux-x86_64.tar.gz.part* > Groundwork-linux-x86_64.tar.gz
      - name: Upload the package to a draft release, in parts under 2 GiB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Groundwork-linux-x86_64.tar.gz | tee Groundwork-linux-x86_64.tar.gz.sha256
          split -b 1900m -a 1 Groundwork-linux-x86_64.tar.gz Groundwork-linux-x86_64.tar.gz.part
          rm Groundwork-linux-x86_64.tar.gz
          ls -l Groundwork-linux-x86_64.tar.gz.part*
          TAG="linux-build-${GITHUB_SHA::7}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Linux build ${GITHUB_SHA::7}" \
            --notes "Groundwork for Linux x86_64, built by run $GITHUB_RUN_ID. Join: cat Groundwork-linux-x86_64.tar.gz.part* > Groundwork-linux-x86_64.tar.gz, then check it against the .sha256 file." \
            Groundwork-linux-x86_64.tar.gz.part* Groundwork-linux-x86_64.tar.gz.sha256
