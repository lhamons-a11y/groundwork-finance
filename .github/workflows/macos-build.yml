name: macOS Build

# PyInstaller can't cross-compile — a macOS .app has to be built on macOS.
# There's no Mac in the loop for local development, so this workflow is the
# only place a mac build can happen. Manual trigger + tag pushes only (no
# per-commit builds — this is a slow, artifact-producing job, not a test).
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    # The oldest macOS the shipped app supports (the website says macOS 14 Sonoma or later). Rob 2026-11-06 raised it
    # from 12: Kokoro needs onnxruntime 1.20.1 or newer, whose Mac wheels need macOS 13, and 14 from 1.24 on. Without
    # this, clang stamps every library it compiles with the runner's own macOS as the minimum (26.0 on macos-latest in
    # 1.1.1), so the engine would load only on macOS 26+. A later step fails the build if anything in the .app needs newer.
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The engine, built here from its official source (Rob 2026-10-08, option (a)). Every published macOS arm64
      # wheel of llama-cpp-python is corrupt - 0.3.35 CPU and Metal, 0.3.34, 0.3.33 all fail their zip CRC on a
      # bundled .dylib (measured 2026-10-08) - so the same pinned version is compiled from the PyPI source instead.
      # With Metal, always (Rob 2026-10-19: "always use metal"). It can't be otherwise here: the source's CMakeLists.txt
      # FORCE-sets GGML_METAL and GGML_METAL_EMBED_LIBRARY ON for every Apple build, so a -DGGML_METAL=OFF is ignored
      # (1.1.1's comment said "CPU only" and shipped libggml-metal anyway). The step fails if Metal is ever missing.
      - name: Build the pinned engine from source (llama-cpp-python 0.3.35, Metal)
        env:
          CMAKE_ARGS: -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
        run: |
          python3 -m pip install --upgrade pip
          pip install --no-binary llama-cpp-python --index-url https://pypi.org/simple "llama-cpp-python==0.3.35"
          python3 -c "import llama_cpp, sys; print('engine', llama_cpp.__version__); sys.exit(llama_cpp.__version__ != '0.3.35')"
          python3 -c "import llama_cpp, sys; ok = llama_cpp.llama_supports_gpu_offload(); print('Metal', ok); sys.exit(not ok)"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          python3 -c "import llama_cpp, sys; sys.exit(llama_cpp.__version__ != '0.3.35')"

      - name: Build .icns from source PNG
        run: |
          pip install --quiet pillow
          python3 build_icns.py
          iconutil -c icns groundwork.iconset -o assets/groundwork.icns

      # Item 33 Q5: the exact tested model, fetched and fingerprint-checked. Any failure here fails the build -
      # a release never ships the wrong model, or none (spec_engine.py checks it again while packaging).
      - name: Fetch and verify the pinned model
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 fetch_model.py
      # The voice files are git-ignored, and without them spec_engine only warns: the build would ship with no voice.
      - name: Fetch and verify the voice models (hearing, speaking, whose voice)
        run: |
          python3 scripts/fetch_whisper_model.py
          python3 scripts/fetch_kokoro_model.py
          python3 scripts/fetch_voiceprint_model.py
      - name: Build with PyInstaller
        run: pyinstaller groundwork_macos.spec --clean --noconfirm

      - name: The engine and the model are inside the app (packaging only - not inference)
        run: |
          find dist/Groundwork.app -name 'libllama*' | grep -q .
          find dist/Groundwork.app -name 'libggml-metal*' | grep -q .
          find dist/Groundwork.app -name 'phi3.5-mini-instruct-q4.gguf' | grep -q .

      - name: The voice is inside the app (packaging only - not a microphone)
        run: |
          find dist/Groundwork.app -name 'ggml-base.en.bin' | grep -q .
          find dist/Groundwork.app -name 'kokoro-v1.0.int8.onnx' | grep -q .
          find dist/Groundwork.app -name 'voices-v1.0.bin' | grep -q .
          find dist/Groundwork.app -name 'voxceleb_resnet34_LM.onnx' | grep -q .
          find dist/Groundwork.app -name '_pywhispercpp*' | grep -q .
          find dist/Groundwork.app -name 'onnxruntime' | grep -q .
          find dist/Groundwork.app -name 'espeakng_loader' | grep -q .

      # Every executable and library in the app must load on the oldest macOS we promise. Reads each Mach-O's minimum
      # (LC_BUILD_VERSION minos, or LC_VERSION_MIN_MACOSX on older binaries) and fails on any above the floor.
      - name: Nothing in the app needs a newer macOS than ${{ env.MACOSX_DEPLOYMENT_TARGET }}
        run: |
          FLOOR="$MACOSX_DEPLOYMENT_TARGET"
          bad=0; n=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            n=$((n + 1))
            for v in $(otool -l "$f" | awk '/cmd LC_BUILD_VERSION/{b=1} b&&/ minos /{print $2; b=0}
                                           /cmd LC_VERSION_MIN_MACOSX/{m=1} m&&/ version /{print $2; m=0}'); do
              if [ "$(printf '%s\n%s\n' "$FLOOR" "$v" | sort -V | tail -1)" != "$FLOOR" ]; then
                echo "::error::needs macOS $v (floor $FLOOR): ${f#dist/}"; bad=1
              fi
            done
          done < <(find dist/Groundwork.app -type f -print0)
          echo "$n Mach-O files checked against macOS $FLOOR"
          [ "$n" -gt 0 ] && [ "$bad" -eq 0 ]

      - name: Zip the .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Groundwork.app ../Groundwork-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Groundwork-macos
          path: Groundwork-macos.zip
          retention-days: 30
