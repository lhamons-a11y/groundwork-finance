name: macOS Build

# PyInstaller can't cross-compile — a macOS .app has to be built on macOS.
# There's no Mac in the loop for local development, so this workflow is the
# only place a mac build can happen. Manual trigger + tag pushes only (no
# per-commit builds — this is a slow, artifact-producing job, not a test).
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The engine, built here from its official source (Rob 2026-10-08, option (a)). Every published macOS arm64
      # wheel of llama-cpp-python is corrupt - 0.3.35 CPU and Metal, 0.3.34, 0.3.33 all fail their zip CRC on a
      # bundled .dylib (measured 2026-10-08) - so the same pinned version is compiled from the PyPI source instead.
      # CPU only (GGML_METAL=OFF), the configuration Windows and Linux ship; Metal would be a different, untested one.
      - name: Build the pinned engine from source (llama-cpp-python 0.3.35, CPU)
        env:
          CMAKE_ARGS: -DGGML_METAL=OFF
        run: |
          python3 -m pip install --upgrade pip
          pip install --no-binary llama-cpp-python --index-url https://pypi.org/simple "llama-cpp-python==0.3.35"
          python3 -c "import llama_cpp, sys; print('engine', llama_cpp.__version__); sys.exit(llama_cpp.__version__ != '0.3.35')"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          python3 -c "import llama_cpp, sys; sys.exit(llama_cpp.__version__ != '0.3.35')"

      - name: Build .icns from source PNG
        run: |
          pip install --quiet pillow
          python3 build_icns.py
          iconutil -c icns groundwork.iconset -o assets/groundwork.icns

      # Item 33 Q5: the exact tested model, fetched and fingerprint-checked. Any failure here fails the build -
      # a release never ships the wrong model, or none (spec_engine.py checks it again while packaging).
      - name: Fetch and verify the pinned model
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 fetch_model.py
      - name: Build with PyInstaller
        run: pyinstaller groundwork_macos.spec --clean --noconfirm

      - name: The engine and the model are inside the app (packaging only - not inference)
        run: |
          find dist/Groundwork.app -name 'libllama*' | grep -q .
          find dist/Groundwork.app -name 'phi3.5-mini-instruct-q4.gguf' | grep -q .

      - name: Zip the .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Groundwork.app ../Groundwork-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Groundwork-macos
          path: Groundwork-macos.zip
          retention-days: 30
